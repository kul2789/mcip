services:
  mysql:
    image: mysql:8.0
    container_name: mcip-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mcip
      MYSQL_USER: mcip
      MYSQL_PASSWORD: mcip
    ports:
      - "3306:3306"
    volumes:
      - mcip_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umcip", "-pmcip"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mcip_mysql:
